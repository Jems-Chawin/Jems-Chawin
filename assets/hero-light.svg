<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 200" width="840" height="200" role="img" aria-label="Hi, I'm Jems. Chawin Sriviset, AI Engineer in Thailand. I teach cameras to notice things. Lately, also agents and robots.">
<style>.h{font:700 46px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:#1f2328}.s{font:400 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:#59636e}.m{font:400 16px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;fill:#1f2328}.tag{font:600 12px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;fill:#fff}.q{font:400 11px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;fill:#59636e}.box{transform-box:fill-box;transform-origin:center;animation:lock 9s cubic-bezier(.2,.8,.2,1) infinite}@keyframes lock{0%{transform:scale(1.5);opacity:0}9%{transform:scale(1);opacity:1}92%{transform:scale(1);opacity:1}100%{transform:scale(1.04);opacity:0}}.lab{animation:lab 9s linear infinite}@keyframes lab{0%,9%{opacity:0}12%,92%{opacity:1}100%{opacity:0}}.scan{animation:scan 9s linear infinite}@keyframes scan{0%{transform:translateY(0);opacity:0}3%{opacity:.7}40%{transform:translateY(190px);opacity:0}100%{opacity:0}}.cur{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
